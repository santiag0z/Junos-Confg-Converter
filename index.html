<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Junos Confg Converter</title>

    <!-- Fontes Plus Jakarta Sans + Fira Code -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- CDN Font Awesome 6 -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Header Superior -->
    <header class="top-nav">
      <div class="logo-group">
        <i class="fa-solid fa-network-wired logo-icon"></i>
        <span class="logo-text">Junos OS Config Converter</span>
      </div>

      <a
        href="https://github.com/santiag0z/Junos-Confg-Converter"
        target="_blank"
        rel="noopener noreferrer"
        class="btn-github"
      >
        <i class="fa-brands fa-github"></i>
        <span>GitHub</span>
      </a>
    </header>

    <!-- Conteúdo Central -->
    <main class="main-wrapper">
      <div class="hero-section">
        <p class="hero-subtitle">
          Convert native Junos OS configurations seamlessly into SET, JSON, or
          XML formats.
        </p>
      </div>

      <div class="app-card">
        <div class="upload-area" id="drop-zone">
          <i class="fa-solid fa-cloud-arrow-up upload-icon"></i>
          <span id="upload-label">
            Click here or drag & drop configuration file (.txt, .conf, .json)
          </span>
          <input type="file" id="file-input" accept=".txt,.conf,.json" />
        </div>

        <div class="controls-row">
          <div class="format-buttons" id="format-buttons">
            <button
              type="button"
              class="btn-format active"
              data-format="set"
              title="Show output in 'set' command format"
            >
              SET
            </button>
            <button
              type="button"
              class="btn-format"
              data-format="json"
              title="Show output in JSON format"
            >
              JSON
            </button>
            <button
              type="button"
              class="btn-format"
              data-format="xml"
              title="Show output in XML format"
            >
              XML
            </button>
          </div>

          <div class="actions">
            <button
              type="button"
              id="btn-copy"
              class="btn-action btn-icon"
              title="Copy output to clipboard"
              disabled
            >
              <i class="fa-solid fa-copy"></i>
            </button>
            <button
              type="button"
              id="btn-download"
              class="btn-action btn-icon"
              title="Download set file"
              disabled
            >
              <i class="fa-solid fa-download"></i>
            </button>
          </div>
        </div>

        <div class="editor-wrapper">
          <textarea
            id="output"
            readonly
            placeholder="The configuration output will appear here after a file is loaded..."
          ></textarea>
        </div>
      </div>
    </main>

    <script src="app.js"></script>

    <!-- Script Oficial Widget Buy Me a Coffee -->
    <script
      data-name="BMC-Widget"
      data-cfasync="false"
      src="https://cdnjs.buymeacoffee.com/1.0.0/widget.prod.min.js"
      data-id="santiagozsk"
      data-description="Support me on Buy me a coffee!"
      data-message=""
      data-color="#5F7FFF"
      data-position="Right"
      data-x_margin="18"
      data-y_margin="18"
    ></script>
  </body>
</html>
